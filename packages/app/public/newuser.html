<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="module">
      import { define, Auth } from "@calpoly/mustang";
      import { LoginFormElement } from "/src/auth/login-form";
      define({ "mu-auth": Auth.Provider, "login-form": LoginFormElement });
    </script>
  </head>
  <body>
    <mu-auth>
      <h2>Sign up</h2>
      <main class="card">
        <login-form api="/auth/register" redirect="/app/playlist/Country">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>
          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>
        </login-form>
      </main>
      <p>Already have an account? <a href="/login.html">Log in</a></p>
    </mu-auth>
  </body>
</html>
