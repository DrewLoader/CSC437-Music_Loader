<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
    <script type="module">
      import { define, Auth } from "https://esm.sh/@calpoly/mustang";

      define({ "mu-auth": Auth.Provider });

      async function handleLogin(e) {
        e.preventDefault();
        const form = e.target;
        const username = form.username.value;
        const password = form.password.value;

        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          alert("Login failed");
          return;
        }
        const { token } = await res.json();

        // Tell <mu-auth> to store the token and go to Country
        const ev = new CustomEvent("auth:message", {
          bubbles: true,
          composed: true,
          detail: ["auth/signin", { token, redirect: "/app/playlist/Country" }]
        });
        document.querySelector("mu-auth")?.dispatchEvent(ev);
      }

      window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("login-form").addEventListener("submit", handleLogin);
      });
    </script>
  </head>
  <body>
    <mu-auth provides="music:auth">
      <h2>Login</h2>
      <form id="login-form">
        <label>Username <input name="username" autocomplete="off" /></label>
        <label>Password <input name="password" type="password" /></label>
        <button type="submit">Login</button>
      </form>
      <p><a href="/newuser.html">Create account</a></p>
    </mu-auth>
  </body>
</html>
