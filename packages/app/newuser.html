<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/page.css">
    <script type="module">
      import { define, Auth } from "@calpoly/mustang";

      define({ "mu-auth": Auth.Provider });

      const authHost = document.createElement("mu-auth");
      document.addEventListener("DOMContentLoaded", () => {
        document.body.prepend(authHost);

        const form = document.getElementById("register");
        const errorEl = document.getElementById("error");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errorEl.textContent = "";

          const fd = new FormData(form);
          const username = fd.get("username");
          const password = fd.get("password");
          const confirm  = fd.get("confirm");

          if (!username || !password) {
            errorEl.textContent = "Please enter a username and password.";
            return;
          }
          if (password !== confirm) {
            errorEl.textContent = "Passwords do not match.";
            return;
          }

          try {
            const res = await fetch("/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password })
            });

            if (res.status !== 201) {
              const text = await res.text();
              throw new Error(text || "Registration failed");
            }

            const { token } = await res.json();

            const ev = new CustomEvent("auth:message", {
              bubbles: true,
              composed: true,
              detail: ["auth/signin", { token, redirect: "/app/playlist/Country" }]
            });
            authHost.dispatchEvent(ev);
          } catch (err) {
            console.error(err);
            errorEl.textContent = String(err.message || err);
          }
        });
      });
    </script>
  </head>
  <body>
    <h1>Create your account</h1>

    <form id="register" novalidate>
      <label>
        <span>Username</span>
        <input name="username" autocomplete="off" required />
      </label>

      <label>
        <span>Password</span>
        <input type="password" name="password" required />
      </label>

      <label>
        <span>Confirm password</span>
        <input type="password" name="confirm" required />
      </label>

      <button type="submit">Create account</button>
      <div id="error" class="error" aria-live="polite"></div>

      <div class="row">
        <span>Already have an account?</span>
        <a href="/login.html">Sign in</a>
      </div>
    </form>
  </body>
</html>
